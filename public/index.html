<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coffee Tracker</title>
  <meta name="description" content="Track your coffees and dial in your espresso.">
  <meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16110e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coffee">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- The camera opens straight from these; they are driven from app.js. -->
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="library-input" type="file" accept="image/*" multiple hidden>
  <input id="import-input" type="file" accept="application/json,.json" hidden>

  <noscript>Coffee Tracker needs JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
